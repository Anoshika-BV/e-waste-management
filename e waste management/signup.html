<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Waste Management - Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <img src="images/logo.png" class="logo">

    <h2>Create Account</h2>

    <form id="signupForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            maxlength="10"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Sign Up
        </button>

    </form>

    <p>
        Already have an account?
        <a href="index.html">Sign In</a>
    </p>

</div>

<script src="js/signup.js"></script>

</body>
</html>
