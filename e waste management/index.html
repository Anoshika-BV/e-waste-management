<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Waste Management | Sign In</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <img src="images/logo.png" alt="E-Waste Logo" class="logo">

    <h2>E-Waste Management</h2>

    <p class="subtitle">
        Recycle Today, Save Tomorrow ♻️
    </p>

    <form id="loginForm">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">
            Sign In
        </button>

    </form>

    <hr>

    <p class="signup-text">
        New User?
        <a href="signup.html">
            Create Account
        </a>
    </p>

    <div class="footer">
        <p>♻️ Together for a Cleaner & Greener Environment 🌍</p>
    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
